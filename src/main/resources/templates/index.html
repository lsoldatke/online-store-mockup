<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <title>Online store mockup</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header>
  <a href="/"><h1>Online store</h1></a>
  <div id="tools">
    <form th:action="@{/articles/search}" method="post" id="search-bar">
      <label for="searched-phrase" hidden>Search: </label>
      <input type="text" name="searched-phrase" id="searched-phrase" placeholder="Search for something...">
      <button type="submit">Search</button>
    </form>
    <ul id="menu">
      <li><a th:href="@{/cart}">Cart</a></li>
      <li><a href="#">Log in / Sign up</a></li>
      <li><a href="#">Menu</a></li>
    </ul>
  </div>
</header>
<main>
  <div id="categories">
    <h2>Categories</h2>
    <ul id="categories-list">
      <li th:each="category: ${categories}"><a
              th:href="@{/articles/category(categoryName=${category})}" th:text="${category}"></a>
      </li>
    </ul>
  </div>
  <div id="content">
    <h2 th:text="${title}">Title</h2>
    <div id="articles">
      <div th:each="article: ${articles}" class="article">
        <img th:src="@{${article.imageUrl}}" alt="Article image">
        <p th:text="${article.name}"></p>
        <p th:text="'Price: ' + ${article.price}"></p>
        <form method="post" th:action="@{/cart/add}">
          <input type="hidden" name="articleId" th:value="${article.id}">
          <label>Quantity: <input type="number" name="quantity" value="1" min="1" max="10000"></label>
          <input type="submit" value="Add to cart">
        </form>
      </div>
    </div>
  </div>
</main>
</body>
</html>
